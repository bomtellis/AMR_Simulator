<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c19">
  <meta name="color-scheme" content="dark">
  <title>{% if page.title != 'Project' %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.page_class | escape }}">
  <div class="space-backdrop" aria-hidden="true">
    <div class="nebula"></div>
    <div class="stars stars-distant"></div>
    <div class="stars stars-near"></div>
  </div>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">A</span> AMR Simulator</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}" {% if page.title == 'Project' %}aria-current="page"{% endif %}>Project</a>
      <a href="{{ '/#downloads' | relative_url }}">Downloads</a>
      <a href="{{ '/development/' | relative_url }}" {% if page.title == 'Development setup' %}aria-current="page"{% endif %}>Development setup</a>
      <a href="{{ '/tutorial/' | relative_url }}" {% if page.title == 'Tutorial' or page.title == 'Building flow guide' %}aria-current="page"{% endif %}>Tutorial</a>
    </nav>
  </header>
  <main id="main-content" class="page-content" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <span>AMR Simulator · Runs on your computer</span>
    <span>Project licence: AGPL-3.0</span>
  </footer>
</body>
</html>
