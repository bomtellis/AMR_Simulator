title: AMR Simulator
description: A project website for the AMR logistics feasibility simulator.
# Update these only when you choose a repository and publish the site.
url: ""
baseurl: "/AMR_Simulator"
plugins:
  - jekyll-relative-links
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - validate_site.py
  - _build
  - SITE-README.md
  - user-guide
  - quick-start
  - geometry-workbench
  - report-kpis.md
  - report-structure.md
  - building-tutorial/COVERAGE.md
  - building-tutorial/coverage.json
  - building-tutorial/Building-Flow-Tutorial.pdf
  - building-tutorial/reference-dedicated.json
  - building-tutorial/reference-shared.json
