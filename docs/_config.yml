title: AMR Simulator
description: Practical operating guidance for the hospital logistics feasibility workbench.
url: "https://bomtellis.github.io"
baseurl: "/AMR_Simulator"
remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
markdown: kramdown
kramdown:
  input: GFM
permalink: pretty
search_enabled: true
search:
  heading_level: 3
  previews: 3
  button: true
heading_anchors: true
color_scheme: light
aux_links:
  "Source on GitHub":
    - "https://github.com/bomtellis/AMR_Simulator"
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/bomtellis/AMR_Simulator"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: edit
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - Gemfile
  - Gemfile.lock
  - validate_site.py
  - _build
  - quick-start/build_guide.py
  - quick-start/capture.py
  - geometry-workbench/build_guide.py
  - building-tutorial/COVERAGE.md
  - building-tutorial/coverage.json
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Check before relying on results
    color: yellow
