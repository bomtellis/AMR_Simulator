name: Engineering verification
on: [push, pull_request, workflow_dispatch]
jobs:
  reference-suite:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install application and verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run verification and build evidence
        run: python -m verification.run --output verification/latest
      - name: Retain evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-verification
          path: verification/latest
